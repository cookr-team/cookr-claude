    <script>
      (function() {
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            const isViteHmr = protocols === 'vite-hmr' || 
                              (typeof protocols === 'string' && protocols.includes('vite')) ||
                              (Array.isArray(protocols) && protocols.includes('vite-hmr'));
            
            if (isViteHmr) {
              console.log("[Vite HMR] Safely bypassing HMR WebSocket connection (HMR is disabled in development mode).");
              const listeners = {};
              const mockWS = {
                url: url,
                readyState: 3, // CLOSED
                bufferedAmount: 0,
                extensions: "",
                protocol: Array.isArray(protocols) ? protocols[0] : (protocols || ""),
                binaryType: "blob",
                addEventListener: function(event, callback) {
                  if (!listeners[event]) listeners[event] = [];
                  listeners[event].push(callback);
                },
                removeEventListener: function(event, callback) {
                  if (!listeners[event]) return;
                  listeners[event] = listeners[event].filter(cb => cb !== callback);
                },
                send: function() {},
                close: function() {},
              };
              let _onopen = null, _onclose = null, _onerror = null, _onmessage = null;
              Object.defineProperty(mockWS, 'onopen', { get() { return _onopen; }, set(val) { _onopen = val; } });
              Object.defineProperty(mockWS, 'onclose', { get() { return _onclose; }, set(val) { _onclose = val; } });
              Object.defineProperty(mockWS, 'onerror', { get() { return _onerror; }, set(val) { _onerror = val; } });
              Object.defineProperty(mockWS, 'onmessage', { get() { return _onmessage; }, set(val) { _onmessage = val; } });
              return mockWS;
            }
            return protocols !== undefined ? new OriginalWebSocket(url, protocols) : new OriginalWebSocket(url);
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING || 0;
          window.WebSocket.OPEN = OriginalWebSocket.OPEN || 1;
          window.WebSocket.CLOSING = OriginalWebSocket.CLOSING || 2;
          window.WebSocket.CLOSED = OriginalWebSocket.CLOSED || 3;
          for (const key in OriginalWebSocket) {
            if (OriginalWebSocket.hasOwnProperty(key)) {
              window.WebSocket[key] = OriginalWebSocket[key];
            }
          }
        }
      })();
    </script>
